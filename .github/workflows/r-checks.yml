name: R workflow checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::dplyr
            any::tidyr
            any::purrr
            any::ggplot2
            any::lme4
      - name: Validate import and model workflow on synthetic data
        run: Rscript tests/run_tests.R
